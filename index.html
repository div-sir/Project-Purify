<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="Project Purify local-first Unicode text forensics workbench" />
  <title>Project Purify — Unicode Text Forensics</title>
  <style>
    :root {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color-scheme: light dark;
      --border: color-mix(in srgb, CanvasText 16%, transparent);
      --muted: color-mix(in srgb, CanvasText 68%, transparent);
      --surface: color-mix(in srgb, Canvas 96%, CanvasText 4%);
      --surface-strong: color-mix(in srgb, Canvas 91%, CanvasText 9%);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: Canvas; color: CanvasText; }
    button, select, textarea { font: inherit; }
    button, select { min-height: 40px; }
    button:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible { outline: 3px solid Highlight; outline-offset: 2px; }
    main { max-width: 1220px; margin: 0 auto; padding: 32px 20px 64px; }
    header { display: flex; justify-content: space-between; gap: 24px; align-items: flex-start; margin-bottom: 24px; }
    h1 { margin: 0 0 6px; font-size: clamp(2rem, 4vw, 3rem); letter-spacing: -.035em; }
    h2 { margin: 0 0 12px; font-size: 1.05rem; }
    p { line-height: 1.55; }
    .sub { color: var(--muted); margin: 0; max-width: 780px; }
    .header-tools { display: flex; gap: 9px; flex-wrap: wrap; justify-content: flex-end; }
    .privacy { display: inline-flex; gap: 8px; align-items: center; white-space: nowrap; padding: 8px 11px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface); font-size: .88rem; }
    .privacy::before { content: "●"; font-size: .7rem; }
    .panel { border: 1px solid var(--border); border-radius: 16px; background: var(--surface); padding: 16px; }
    .editor-grid, .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    textarea { width: 100%; min-height: 300px; resize: vertical; border: 1px solid var(--border); border-radius: 12px; padding: 14px; background: Canvas; color: CanvasText; line-height: 1.55; }
    textarea[readonly] { background: var(--surface); }
    .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin: 14px 0 16px; align-items: center; }
    button, select { border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; background: var(--surface-strong); color: CanvasText; cursor: pointer; }
    .primary { font-weight: 650; }
    .drop { margin: 0 0 18px; border: 1px dashed var(--border); border-radius: 14px; padding: 13px 15px; color: var(--muted); transition: background .15s ease; }
    .drop.drag { background: var(--surface-strong); color: CanvasText; }
    .stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; margin: 0 0 18px; }
    .stat { border: 1px solid var(--border); border-radius: 12px; background: var(--surface); padding: 12px; }
    .stat strong { display: block; font-size: 1.35rem; margin-top: 4px; }
    .stat span { color: var(--muted); font-size: .82rem; }
    pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .codebox { min-height: 110px; border: 1px solid var(--border); border-radius: 12px; padding: 13px; background: Canvas; overflow: auto; }
    .filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
    .filters label, .header-tools label { display: inline-flex; gap: 7px; align-items: center; color: var(--muted); font-size: .88rem; }
    .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 12px; }
    table { width: 100%; border-collapse: collapse; min-width: 760px; }
    th, td { text-align: left; padding: 10px 11px; border-bottom: 1px solid var(--border); vertical-align: top; font-size: .9rem; }
    th { background: var(--surface-strong); font-size: .78rem; text-transform: uppercase; letter-spacing: .04em; }
    tbody tr:last-child td { border-bottom: 0; }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .severity { display: inline-block; border: 1px solid var(--border); border-radius: 999px; padding: 2px 7px; text-transform: uppercase; font-size: .72rem; }
    .muted { color: var(--muted); }
    .section { margin-top: 22px; }
    .empty { color: var(--muted); padding: 18px; text-align: center; }
    .file-meta { color: var(--muted); font-size: .85rem; margin-left: auto; }
    .notice { margin-top: 22px; padding: 12px 14px; border-left: 3px solid var(--border); color: var(--muted); font-size: .9rem; }
    @media (max-width: 900px) { .stats { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 820px) {
      header { display: block; }
      .header-tools { justify-content: flex-start; margin-top: 14px; }
      .editor-grid, .detail-grid { grid-template-columns: 1fr; }
      .stats { grid-template-columns: 1fr 1fr; }
      .file-meta { width: 100%; margin-left: 0; }
    }
    @media (max-width: 480px) {
      main { padding-inline: 14px; }
      .stats { grid-template-columns: 1fr; }
      button, select { width: 100%; }
      .filters label, .header-tools label { width: 100%; justify-content: space-between; }
    }
  </style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Project Purify</h1>
      <p class="sub" data-i18n="subtitle"></p>
    </div>
    <div class="header-tools">
      <label><span data-i18n="uiLanguage"></span>
        <select id="uiLanguage">
          <option value="en">English</option>
          <option value="zh-Hant">繁體中文</option>
          <option value="ja">日本語</option>
        </select>
      </label>
      <label><span data-i18n="analysisLanguage"></span>
        <select id="analysisLanguage">
          <option value="auto">Auto</option>
          <option value="en">English</option>
          <option value="zh-Hant">繁體中文</option>
          <option value="ja">日本語</option>
          <option value="ko">한국어</option>
          <option value="ar">العربية</option>
        </select>
      </label>
      <div class="privacy" data-i18n="privacy"></div>
    </div>
  </header>

  <div id="dropZone" class="drop" tabindex="0" role="button" data-i18n="drop"></div>

  <section class="editor-grid">
    <div class="panel">
      <h2 data-i18n="original"></h2>
      <textarea id="input" spellcheck="false" aria-label="Original text"></textarea>
    </div>
    <div class="panel">
      <h2 data-i18n="clean"></h2>
      <textarea id="clean" readonly spellcheck="false" aria-label="Clean text"></textarea>
    </div>
  </section>

  <div class="toolbar">
    <button class="primary" id="scan" type="button" data-i18n="reanalyze"></button>
    <button id="copy" type="button" data-i18n="copyClean"></button>
    <button id="download" type="button" data-i18n="downloadReport"></button>
    <button id="openFile" type="button" data-i18n="openFile"></button>
    <button id="sample" type="button" data-i18n="sample"></button>
    <input id="fileInput" type="file" accept=".txt,.md,.markdown,text/plain,text/markdown" hidden />
    <span class="file-meta" id="fileMeta" aria-live="polite"></span>
  </div>

  <section class="stats">
    <div class="stat"><span data-i18n="allFindings"></span><strong id="count">0</strong></div>
    <div class="stat"><span data-i18n="highRisk"></span><strong id="high">0</strong></div>
    <div class="stat"><span data-i18n="confusables"></span><strong id="confusableCount">0</strong></div>
    <div class="stat"><span data-i18n="mixedScripts"></span><strong id="mixedScriptCount">0</strong></div>
    <div class="stat"><span data-i18n="safeCleaning"></span><strong id="changed">—</strong></div>
  </section>

  <section class="detail-grid">
    <div class="panel">
      <h2 data-i18n="inlineMarkers"></h2>
      <p class="sub" data-i18n="inlineHelp"></p>
      <div class="codebox section"><pre id="annotated"></pre></div>
    </div>
    <div class="panel">
      <h2 data-i18n="skeleton"></h2>
      <p class="sub" data-i18n="skeletonHelp"></p>
      <div class="codebox section"><pre id="skeleton"></pre></div>
    </div>
  </section>

  <section class="panel section">
    <h2 data-i18n="shapingTitle"></h2>
    <p class="sub" data-i18n="shapingHelp"></p>
  </section>

  <section class="panel section">
    <h2 data-i18n="changes"></h2>
    <div class="table-wrap">
      <table>
        <thead><tr><th data-i18n="originalPosition"></th><th data-i18n="cleanPosition"></th><th data-i18n="removed"></th><th data-i18n="added"></th></tr></thead>
        <tbody id="changes"></tbody>
      </table>
      <div class="empty" id="changesEmpty" data-i18n="noChanges"></div>
    </div>
  </section>

  <section class="panel section">
    <h2 data-i18n="findings"></h2>
    <div class="filters">
      <label><span data-i18n="severity"></span>
        <select id="severityFilter">
          <option value="all"></option>
          <option value="high">High</option>
          <option value="medium">Medium</option>
          <option value="low">Low</option>
        </select>
      </label>
      <label><span data-i18n="category"></span>
        <select id="categoryFilter"></select>
      </label>
      <span class="muted" id="filterCount" aria-live="polite"></span>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th data-i18n="position"></th><th data-i18n="charType"></th><th data-i18n="risk"></th><th data-i18n="reason"></th><th data-i18n="remediation"></th></tr></thead>
        <tbody id="results"></tbody>
      </table>
      <div class="empty" id="resultsEmpty" data-i18n="noFindings"></div>
    </div>
  </section>

  <p class="notice" data-i18n="notice"></p>
</main>

<script type="module">
  import { createWorkbenchModel, filterFindings } from './src/workbench.js';
  import { translate } from './src/i18n.js';

  const MAX_BROWSER_FILE_BYTES = 5 * 1024 * 1024;
  const ALLOWED_FILE_EXTENSIONS = ['.txt', '.md', '.markdown'];
  const input = document.querySelector('#input');
  const clean = document.querySelector('#clean');
  const annotated = document.querySelector('#annotated');
  const skeleton = document.querySelector('#skeleton');
  const results = document.querySelector('#results');
  const changes = document.querySelector('#changes');
  const resultsEmpty = document.querySelector('#resultsEmpty');
  const changesEmpty = document.querySelector('#changesEmpty');
  const severityFilter = document.querySelector('#severityFilter');
  const categoryFilter = document.querySelector('#categoryFilter');
  const filterCount = document.querySelector('#filterCount');
  const fileMeta = document.querySelector('#fileMeta');
  const dropZone = document.querySelector('#dropZone');
  const fileInput = document.querySelector('#fileInput');
  const uiLanguage = document.querySelector('#uiLanguage');
  const analysisLanguage = document.querySelector('#analysisLanguage');
  let model = createWorkbenchModel('');
  let renderTimer = null;

  function initialUiLanguage() {
    const language = navigator.language ?? 'en';
    if (language.startsWith('zh')) return 'zh-Hant';
    if (language.startsWith('ja')) return 'ja';
    return 'en';
  }

  function t(key) { return translate(uiLanguage.value, key); }

  function applyI18n() {
    document.documentElement.lang = uiLanguage.value;
    for (const element of document.querySelectorAll('[data-i18n]')) element.textContent = t(element.dataset.i18n);
    severityFilter.options[0].textContent = t('all');
    renderCategories();
    document.querySelector('#changed').textContent = model.report.summary.changed ? t('changed') : t('noChange');
  }

  function cell(text) {
    const td = document.createElement('td');
    td.textContent = text;
    return td;
  }

  function fragmentDetails(text) {
    if (!text) return '—';
    return [...text].map((ch) => {
      const cp = ch.codePointAt(0);
      const label = `U+${cp.toString(16).toUpperCase().padStart(4, '0')}`;
      const visible = /\s/u.test(ch) || cp < 0x20 || cp === 0x7F ? '' : ` ${ch}`;
      return `${label}${visible}`;
    }).join(' · ');
  }

  function findingLabel(finding) {
    if (finding.label) return `${finding.label} · ${finding.title}`;
    if (finding.source === 'mixed-script') return `${finding.title} · ${finding.token}`;
    return finding.title ?? finding.type ?? 'finding';
  }

  function renderCategories() {
    const selected = categoryFilter.value;
    categoryFilter.replaceChildren(new Option(t('all'), 'all'));
    for (const category of model.categories) categoryFilter.add(new Option(category, category));
    categoryFilter.value = model.categories.includes(selected) ? selected : 'all';
  }

  function renderFindings() {
    const filtered = filterFindings(model.findings, { severity: severityFilter.value, category: categoryFilter.value });
    results.replaceChildren();
    for (const finding of filtered) {
      const tr = document.createElement('tr');
      tr.append(cell(String(finding.charIndex)));
      tr.append(cell(findingLabel(finding)));
      const severity = cell('');
      const badge = document.createElement('span');
      badge.className = 'severity';
      badge.textContent = finding.severity;
      severity.append(badge);
      tr.append(severity);
      tr.append(cell(finding.reason ?? '—'));
      tr.append(cell(finding.remediation ?? '—'));
      results.append(tr);
    }
    resultsEmpty.hidden = filtered.length > 0;
    filterCount.textContent = `${filtered.length} / ${model.findings.length}`;
  }

  function renderChanges() {
    changes.replaceChildren();
    for (const change of model.changes) {
      const tr = document.createElement('tr');
      tr.append(cell(String(change.originalStart)));
      tr.append(cell(String(change.cleanedStart)));
      tr.append(cell(fragmentDetails(change.removed)));
      tr.append(cell(fragmentDetails(change.added)));
      changes.append(tr);
    }
    changesEmpty.hidden = model.changes.length > 0;
  }

  function render() {
    model = createWorkbenchModel(input.value, { scripts: { languageHint: analysisLanguage.value } });
    clean.value = model.cleanedText;
    annotated.textContent = model.annotatedText;
    skeleton.textContent = model.confusableSkeleton;
    document.querySelector('#count').textContent = String(model.findings.length);
    document.querySelector('#high').textContent = String(model.findings.filter((finding) => finding.severity === 'high').length);
    document.querySelector('#confusableCount').textContent = String(model.report.summary.confusableCount);
    document.querySelector('#mixedScriptCount').textContent = String(model.report.summary.mixedScriptCount);
    document.querySelector('#changed').textContent = model.report.summary.changed ? t('changed') : t('noChange');
    renderCategories();
    renderFindings();
    renderChanges();
  }

  function scheduleRender() {
    clearTimeout(renderTimer);
    renderTimer = setTimeout(render, 80);
  }

  async function copyCleanText() {
    try {
      await navigator.clipboard.writeText(clean.value);
    } catch {
      clean.focus();
      clean.select();
      document.execCommand('copy');
    }
    fileMeta.textContent = t('copied');
  }

  function downloadReport() {
    const blob = new Blob([JSON.stringify(model.report, null, 2)], { type: 'application/json;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = 'project-purify-report.json';
    document.body.append(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(url);
  }

  function extensionOf(name) {
    const lower = name.toLowerCase();
    return ALLOWED_FILE_EXTENSIONS.find((ext) => lower.endsWith(ext)) ?? '';
  }

  async function loadFile(file) {
    if (!extensionOf(file.name)) throw new Error(t('invalidFile'));
    if (file.size > MAX_BROWSER_FILE_BYTES) throw new Error(t('largeFile'));
    input.value = await file.text();
    fileMeta.textContent = `${file.name} · ${file.size.toLocaleString()} bytes`;
    render();
  }

  async function handleFiles(files) {
    const file = files?.[0];
    if (!file) return;
    try { await loadFile(file); }
    catch (error) { fileMeta.textContent = error.message; }
  }

  uiLanguage.value = initialUiLanguage();
  analysisLanguage.value = 'auto';
  applyI18n();

  document.querySelector('#scan').addEventListener('click', render);
  document.querySelector('#copy').addEventListener('click', copyCleanText);
  document.querySelector('#download').addEventListener('click', downloadReport);
  document.querySelector('#openFile').addEventListener('click', () => fileInput.click());
  document.querySelector('#sample').addEventListener('click', () => {
    input.value = 'Normal / 正常文字：AI生成テスト\nInvisible：A\u200BB\nMixed-script：pаypal（second letter is Cyrillic а）\nBidi：abc\u202Edef\nEmoji ZWJ：👨‍👩‍👧‍👦';
    fileMeta.textContent = t('sampleMeta');
    render();
  });
  uiLanguage.addEventListener('change', () => { applyI18n(); renderFindings(); renderChanges(); });
  analysisLanguage.addEventListener('change', render);
  fileInput.addEventListener('change', () => handleFiles(fileInput.files));
  input.addEventListener('input', scheduleRender);
  severityFilter.addEventListener('change', renderFindings);
  categoryFilter.addEventListener('change', renderFindings);

  for (const eventName of ['dragenter', 'dragover']) {
    dropZone.addEventListener(eventName, (event) => { event.preventDefault(); dropZone.classList.add('drag'); });
  }
  for (const eventName of ['dragleave', 'drop']) {
    dropZone.addEventListener(eventName, (event) => { event.preventDefault(); dropZone.classList.remove('drag'); });
  }
  dropZone.addEventListener('drop', (event) => handleFiles(event.dataTransfer.files));
  dropZone.addEventListener('click', () => fileInput.click());
  dropZone.addEventListener('keydown', (event) => {
    if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); fileInput.click(); }
  });

  render();
</script>
</body>
</html>
