<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Project Purify</title>
  <style>
    :root { font-family: Inter, ui-sans-serif, system-ui, sans-serif; color-scheme: light dark; }
    * { box-sizing: border-box; }
    body { margin: 0; width: 390px; min-height: 420px; background: Canvas; color: CanvasText; }
    main { padding: 16px; }
    h1 { margin: 0; font-size: 1.15rem; }
    .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; }
    .local { font-size: .75rem; opacity: .7; white-space: nowrap; }
    textarea { width: 100%; min-height: 112px; resize: vertical; border: 1px solid color-mix(in srgb, CanvasText 18%, transparent); border-radius: 10px; padding: 10px; background: Canvas; color: CanvasText; font: inherit; }
    textarea[readonly] { background: color-mix(in srgb, Canvas 94%, CanvasText 6%); }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin: 9px 0 12px; }
    button { border: 1px solid color-mix(in srgb, CanvasText 18%, transparent); border-radius: 9px; padding: 8px 10px; background: color-mix(in srgb, Canvas 90%, CanvasText 10%); color: CanvasText; cursor: pointer; }
    button:focus-visible, textarea:focus-visible { outline: 3px solid Highlight; outline-offset: 2px; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin: 10px 0; }
    .stat { border: 1px solid color-mix(in srgb, CanvasText 15%, transparent); border-radius: 9px; padding: 8px; text-align: center; }
    .stat strong { display: block; font-size: 1.1rem; }
    .stat span { display: block; opacity: .65; font-size: .7rem; }
    h2 { font-size: .85rem; margin: 12px 0 6px; }
    ul { margin: 0; padding: 0; list-style: none; max-height: 145px; overflow: auto; }
    li { border-top: 1px solid color-mix(in srgb, CanvasText 13%, transparent); padding: 7px 0; font-size: .78rem; line-height: 1.4; }
    li:first-child { border-top: 0; }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .muted { opacity: .68; }
    #status { min-height: 18px; font-size: .75rem; opacity: .72; }
  </style>
</head>
<body>
<main>
  <div class="top">
    <h1>Project Purify</h1>
    <span class="local">Local only</span>
  </div>

  <textarea id="input" aria-label="Text to analyze" placeholder="Select text on the page or paste text here."></textarea>
  <div class="toolbar">
    <button id="selection" type="button">Use page selection</button>
    <button id="page" type="button">Scan visible page</button>
    <button id="copy" type="button">Copy clean</button>
    <button id="clear" type="button">Clear</button>
  </div>

  <div class="stats" aria-label="Finding summary">
    <div class="stat"><strong id="total">0</strong><span>Findings</span></div>
    <div class="stat"><strong id="high">0</strong><span>High</span></div>
    <div class="stat"><strong id="confusables">0</strong><span>Confusables</span></div>
  </div>

  <h2>Clean text</h2>
  <textarea id="clean" readonly aria-label="Cleaned text"></textarea>

  <h2>Findings</h2>
  <ul id="findings"></ul>
  <div id="status" aria-live="polite"></div>
</main>
<script type="module" src="popup.js"></script>
</body>
</html>
