name: Project Purify Scan

on:
  workflow_call:
    inputs:
      path:
        description: Directory to scan in the caller repository.
        required: false
        type: string
        default: '.'
      severity:
        description: Lowest severity that fails the workflow: low, medium, or high.
        required: false
        type: string
        default: high
      language:
        description: Mixed-script language policy hint: auto, en, zh-Hant, zh, ja, ko, or ar.
        required: false
        type: string
        default: auto
      include:
        description: Optional include glob.
        required: false
        type: string
        default: ''
      exclude:
        description: Optional additional exclude glob.
        required: false
        type: string
        default: ''
      upload-sarif:
        description: Upload results to GitHub code scanning. Caller must allow security-events write.
        required: false
        type: boolean
        default: false
      purify-ref:
        description: Project Purify ref to use. Pin a release tag for production workflows.
        required: false
        type: string
        default: main

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v6

      - name: Checkout Project Purify
        uses: actions/checkout@v6
        with:
          repository: div-sir/Project-Purify
          ref: ${{ inputs.purify-ref }}
          path: .project-purify

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Project Purify
        id: purify
        shell: bash
        run: |
          set +e
          args=(
            --dir "${{ inputs.path }}"
            --sarif
            --language "${{ inputs.language }}"
            --fail-on-severity "${{ inputs.severity }}"
            --exclude "**/.project-purify/**"
          )
          if [[ -n "${{ inputs.include }}" ]]; then
            args+=(--include "${{ inputs.include }}")
          fi
          if [[ -n "${{ inputs.exclude }}" ]]; then
            args+=(--exclude "${{ inputs.exclude }}")
          fi
          node .project-purify/src/cli.js "${args[@]}" > project-purify.sarif
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload Project Purify SARIF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-purify-sarif
          path: project-purify.sarif

      - name: Upload SARIF to GitHub code scanning
        if: always() && inputs.upload-sarif
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: project-purify.sarif
          category: project-purify

      - name: Enforce Project Purify exit policy
        if: always()
        shell: bash
        run: exit "${{ steps.purify.outputs.status }}"
